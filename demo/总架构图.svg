<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1010" font-family="'Segoe UI','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1280" height="1010" fill="#FFFFFF"/>

  <!-- title -->
  <text x="640" y="34" text-anchor="middle" font-size="23" font-weight="700" fill="#0F172A">note-assistant 总架构图 · 双管道 RAG 问答系统</text>
  <text x="640" y="56" text-anchor="middle" font-size="12" fill="#64748B">离线索引（写侧）与在线问答（读侧）双链路 · 横切安全 / 评测 / 配置</text>

  <!-- section labels -->
  <text x="60" y="92" font-size="15" font-weight="700" fill="#2563EB">① 离线索引管道（写侧 · 全量重建 / 增量 sync）</text>
  <text x="680" y="92" font-size="15" font-weight="700" fill="#7C3AED">② 在线问答管道（读侧 · 双管道并存）</text>

  <!-- ============ COLUMN A: WRITE SIDE ============ -->
  <g stroke-width="1.6">
    <rect x="60" y="110" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="182" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="254" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="326" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="398" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="470" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="542" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
    <rect x="60" y="614" width="560" height="58" rx="9" fill="#DBEAFE" stroke="#2563EB"/>
  </g>
  <!-- A text -->
  <g text-anchor="middle" fill="#0F172A">
    <text x="340" y="130" font-size="13" font-weight="700">VaultLoader</text>
    <text x="340" y="148" font-size="11" fill="#334155">扫描 vault · YAML front matter · wikilinks · heading tree → DocNode</text>

    <text x="340" y="202" font-size="13" font-weight="700">RichPreprocessor</text>
    <text x="340" y="220" font-size="11" fill="#334155">富结构占位：code / table / mermaid / image</text>

    <text x="340" y="274" font-size="13" font-weight="700">splitter（v1 / v2 / v2b 父子双存）</text>
    <text x="340" y="292" font-size="11" fill="#334155">两层切分：HeaderTextSplitter → Recursive(800/150, 中文感知)</text>

    <text x="340" y="346" font-size="13" font-weight="700">restore</text>
    <text x="340" y="364" font-size="11" fill="#334155">富结构还原回原文</text>

    <text x="340" y="418" font-size="13" font-weight="700">enrich</text>
    <text x="340" y="436" font-size="11" fill="#334155">wikilinks / metadata + 图片 VLM 理解(8字段 → summary chunk)</text>

    <text x="340" y="490" font-size="13" font-weight="700">Ingestor.upsert</text>
    <text x="340" y="508" font-size="11" fill="#334155">bge-m3 embed → ChromaDB(cosine)</text>

    <text x="340" y="562" font-size="13" font-weight="700">ChromaDB + ParentDocstore</text>
    <text x="340" y="580" font-size="11" fill="#334155">child → 向量库检索 / parent → pkl 还原 (via parent_id)</text>

    <text x="340" y="634" font-size="13" font-weight="700">sync.py（增量索引）</text>
    <text x="340" y="652" font-size="11" fill="#334155">mtime + sha256 比对，只动变化文件</text>
  </g>

  <!-- ============ COLUMN B: READ SIDE ============ -->
  <g stroke-width="1.6">
    <rect x="680" y="110" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <rect x="680" y="182" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <rect x="680" y="254" width="250" height="58" rx="9" fill="#E0E7FF" stroke="#4338CA"/>
    <rect x="950" y="254" width="250" height="58" rx="9" fill="#FCE7F3" stroke="#BE185D"/>
    <rect x="680" y="326" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <rect x="680" y="398" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <rect x="680" y="470" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <rect x="680" y="542" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
    <rect x="680" y="614" width="520" height="58" rx="9" fill="#EDE9FE" stroke="#7C3AED"/>
  </g>
  <g text-anchor="middle" fill="#0F172A">
    <text x="940" y="130" font-size="13" font-weight="700">API 入口 main.py</text>
    <text x="940" y="148" font-size="11" fill="#334155">/ask /ask_stream /ask_trace /agent/ask /agent/ask_stream /runs /sessions</text>

    <text x="940" y="202" font-size="13" font-weight="700">双管道分流</text>
    <text x="940" y="220" font-size="11" fill="#334155">朴素 RAG（低延迟） ↔ Agentic RAG（多轮推理）</text>

    <text x="805" y="274" font-size="12.5" font-weight="700">Naive RAG</text>
    <text x="805" y="292" font-size="10.5" fill="#334155">rag_chain.py：检索→生成 直连</text>

    <text x="1075" y="274" font-size="12.5" font-weight="700">Agentic RAG</text>
    <text x="1075" y="292" font-size="10.5" fill="#334155">LangGraph StateGraph：11 节点 / 7 工具</text>

    <text x="940" y="346" font-size="13" font-weight="700">检索层（共享）</text>
    <text x="940" y="364" font-size="11" fill="#334155">hybrid(dense+sparse) + structural + rerank + query_rewrite + WikiGraph + ParentDocstore</text>

    <text x="940" y="418" font-size="13" font-weight="700">生成层</text>
    <text x="940" y="436" font-size="11" fill="#334155">generator(LangChain 流式) + image_answer(以文检图渲染)</text>

    <text x="940" y="490" font-size="13" font-weight="700">ContextManager</text>
    <text x="940" y="508" font-size="11" fill="#334155">跨轮记忆 · identity_key 去重 · 指代消解降级链</text>

    <text x="940" y="562" font-size="13" font-weight="700">SemanticCache</text>
    <text x="940" y="580" font-size="11" fill="#334155">精确 + 语义 · ctx_key 防串台</text>

    <text x="940" y="634" font-size="13" font-weight="700">AgentStore</text>
    <text x="940" y="652" font-size="11" fill="#334155">SQLite 四表：runs / sessions / messages / turn</text>
  </g>

  <!-- ============ arrows within columns ============ -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <!-- A vertical -->
    <line x1="340" y1="168" x2="340" y2="180"/>
    <line x1="340" y1="240" x2="340" y2="252"/>
    <line x1="340" y1="312" x2="340" y2="324"/>
    <line x1="340" y1="384" x2="340" y2="396"/>
    <line x1="340" y1="456" x2="340" y2="468"/>
    <line x1="340" y1="528" x2="340" y2="540"/>
    <line x1="340" y1="600" x2="340" y2="612"/>
    <!-- B vertical -->
    <line x1="940" y1="168" x2="940" y2="180"/>
    <!-- B router -> two branches -->
    <line x1="940" y1="240" x2="805" y2="252"/>
    <line x1="940" y1="240" x2="1075" y2="252"/>
    <!-- two branches -> retriever -->
    <line x1="805" y1="312" x2="940" y2="324"/>
    <line x1="1075" y1="312" x2="940" y2="324"/>
    <line x1="940" y1="384" x2="940" y2="396"/>
    <line x1="940" y1="456" x2="940" y2="468"/>
    <line x1="940" y1="528" x2="940" y2="540"/>
    <line x1="940" y1="600" x2="940" y2="612"/>
  </g>

  <!-- ============ CROSS-CUTTING BAND ============ -->
  <g stroke-width="1.6" stroke-dasharray="6 4">
    <rect x="60" y="696" width="1140" height="54" rx="9" fill="#CCFBF1" stroke="#0D9488"/>
    <rect x="60" y="762" width="1140" height="64" rx="9" fill="#FEF3C7" stroke="#D97706"/>
    <rect x="60" y="834" width="1140" height="54" rx="9" fill="#F1F5F9" stroke="#475569"/>
  </g>
  <g text-anchor="middle" fill="#0F172A">
    <text x="640" y="716" font-size="13" font-weight="700">③ 安全护栏（横切 · L1→L4）</text>
    <text x="640" y="734" font-size="11" fill="#334155">L1 输入 guardrails → L2 sanitize → L3 agent 门禁 → L4 output_guard</text>

    <text x="640" y="784" font-size="13" font-weight="700">④ 评测与运维</text>
    <text x="640" y="802" font-size="11" fill="#334155">evaluator：retrieval(recall/MRR/nDCG) · generation(faithfulness) · ragas</text>
    <text x="640" y="818" font-size="11" fill="#334155">token 零侵入统计 · 缓存命中双口径(semantic Q&amp;A vs gateway prompt-caching)</text>

    <text x="640" y="856" font-size="13" font-weight="700">⑤ 配置层</text>
    <text x="640" y="874" font-size="11" fill="#334155">config.py：pydantic-settings env_file=None + load_dotenv 双重加载；.env / .env.local 覆盖</text>
  </g>

  <!-- dashed cross links from guardrail to read pipeline -->
  <g stroke="#0D9488" stroke-width="1.2" stroke-dasharray="4 4" fill="none" opacity="0.6">
    <line x1="940" y1="672" x2="940" y2="694"/>
  </g>

  <!-- footer -->
  <text x="640" y="912" text-anchor="middle" font-size="12" fill="#0F172A" font-weight="600">核心设计：双管道并存(Naive 低延迟 / Agent 多轮) · 离线写侧 v2b 父子双存 · 以文检图 · 查询期融合参数不重索引 · 增量 sync 不重建派生产物</text>

  <!-- legend -->
  <g font-size="11" fill="#334155">
    <rect x="60" y="944" width="14" height="14" rx="3" fill="#DBEAFE" stroke="#2563EB"/>
    <text x="80" y="955">写侧</text>
    <rect x="150" y="944" width="14" height="14" rx="3" fill="#EDE9FE" stroke="#7C3AED"/>
    <text x="170" y="955">读侧</text>
    <rect x="240" y="944" width="14" height="14" rx="3" fill="#E0E7FF" stroke="#4338CA"/>
    <text x="260" y="955">Naive</text>
    <rect x="340" y="944" width="14" height="14" rx="3" fill="#FCE7F3" stroke="#BE185D"/>
    <text x="360" y="955">Agent</text>
    <rect x="450" y="944" width="14" height="14" rx="3" fill="#CCFBF1" stroke="#0D9488"/>
    <text x="470" y="955">安全</text>
    <rect x="540" y="944" width="14" height="14" rx="3" fill="#FEF3C7" stroke="#D97706"/>
    <text x="560" y="955">评测</text>
    <rect x="630" y="944" width="14" height="14" rx="3" fill="#F1F5F9" stroke="#475569"/>
    <text x="650" y="955">配置</text>
    <text x="740" y="955" fill="#64748B">实线=数据流 · 虚线=横切关注点</text>
  </g>
</svg>
