[project]
name = "note-assistant"
version = "0.1.0"
description = "RAG-powered personal knowledge base assistant for Obsidian notes"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LangChain
    "langchain==1.3.11",
    "langgraph>=1.0",
    "langchain-community",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-ollama",
    # Embedding
    "sentence-transformers",
    "FlagEmbedding",
    # Retrieval
    "rank-bm25",
    "jieba",
    # Vector DB
    "chromadb>=1.0,<2",
    # Parsing
    "python-frontmatter",
    # API
    "fastapi",
    "uvicorn[standard]",
    # Config
    "python-dotenv",
    "pydantic>=2.10,<3",
    "tqdm",
    "langchain-core>=1.4.8",
    "ollama>=0.6.2",
    "transformers>=5.12.1",
    "openai>=2.44.0",
    "jieba>=0.42.1",
    "ipykernel>=7.3.0",
    "langchain-openai>=1.3.3",
    "networkx>=3.6.1",
    "streamlit>=1.58.0",
    # Evaluation
    "ragas>=0.3.0",
    "datasets>=2.0",
    "tiktoken>=0.13.0",
    "python-json-logger>=4.1.0",
    "langsmith>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "ipython",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/note_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
