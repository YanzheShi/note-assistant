[project]
name = "note-assistant"
version = "0.1.0"
description = "RAG-powered personal knowledge base assistant for Obsidian notes"
requires-python = ">=3.12"
dependencies = [
    # LangChain
    "langchain==1.3.11",
    "langgraph>=1.0",
    "langchain-community",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-ollama",

    # Embedding
    "sentence-transformers",
    "FlagEmbedding",

    # Retrieval
    "rank-bm25",

    # Vector DB
    "chromadb>=1.0,<2",

    # Parsing
    "python-frontmatter",

    # API
    "fastapi",
    "uvicorn[standard]",

    # Config
    "python-dotenv",
    "pydantic>=2.10,<3",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "ipython",
]

[tool.hatch.build.targets.wheel]
packages = ["src/note_assistant"]