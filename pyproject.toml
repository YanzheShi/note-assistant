[project]
name = "note-assistant"
version = "0.1.0"
description = "RAG-powered personal knowledge base assistant for Obsidian notes"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # LangChain
    "langchain==1.3.11",
    "langgraph>=1.0",
    "langchain-community",
    "langchain-chroma",
    "langchain-text-splitters",
    "langchain-ollama",
    # Embedding
    "sentence-transformers",
    "FlagEmbedding",
    "torch==2.12.1",
    "torchvision==0.27.1",
    # Retrieval
    "rank-bm25",
    "jieba",
    # Vector DB
    "chromadb>=1.0,<2",
    # Parsing
    "python-frontmatter",
    # API
    "fastapi",
    "uvicorn[standard]",
    # 自动增量索引（watcher；uvicorn[standard] 已传递引入，显式声明防移除）
    "watchfiles",
    # Config
    "python-dotenv",
    "pydantic>=2.10,<3",
    "tqdm",
    "langchain-core>=1.4.8",
    "ollama>=0.6.2",
    "transformers>=5.12.1",
    "openai>=2.44.0",
    "jieba>=0.42.1",
    "ipykernel>=7.3.0",
    "langchain-openai>=1.3.3",
    "networkx>=3.6.1",
    "streamlit>=1.58.0",
    # "streamlit-clipboard>=0.0.6",  # 已废弃：name 被前端当按钮文字、不透传 key、点击无反馈。
    #                                      改用 st.components.v1.html 自定义 JS 按钮（见 source_expander.py）。
    #                                      保留在 .venv 但不再 import；下次 uv sync --upgrade 可安全移除。
    # Evaluation
    "ragas>=0.3.0",
    "datasets>=2.0",
    "tiktoken>=0.13.0",
    "python-json-logger>=4.1.0",
    "langsmith>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "ipython",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/note_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]
torchvision = [{ index = "pytorch-cu126" }]
